server {
    listen 3001;
    listen [::]:3001;
    server_name 47.103.122.202;

    # Private records are reachable only by SSH forwarding to the app's localhost port.
    location = /owner { return 404; }
    location ^~ /owner/ { return 404; }
    location ^~ /api/owner/ { return 404; }

    location = /api/shanghai-guide/chat {
        limit_req zone=qixi_siyi_api burst=6 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
